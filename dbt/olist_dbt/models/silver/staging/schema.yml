
version: 2

models:
  - name: stg_orders
    description: "Cleaned Olist order data"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
      - name: order_status
        data_tests:
          - not_null
      - name: order_purchase_timestamp
        data_tests:
          - not_null

  - name: stg_order_items
    description: "Cleaned order item data"
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: order_item_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: seller_id
        data_tests:
          - not_null

  - name: stg_customers
    description: "Cleaned customer data"
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: customer_unique_id
        data_tests:
          - not_null

  - name: stg_products
    description: "Cleaned product data"
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
  
  - name: stg_sellers
    description: "Cleaned seller data"
    columns:
      - name: seller_id
        data_tests:
          - not_null
          - unique

  - name: stg_order_payments
    description: "Cleaned order payment data"
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: payment_sequential
        data_tests:
          - not_null

  - name: stg_order_reviews
    description: "Cleaned order review data"
    columns:
      - name: review_id
        data_tests:
          - not_null

  - name: stg_geolocation
    description: "Cleaned geolocation data"
    columns:
      - name: geolocation_zip_code_prefix
        data_tests:
          - not_null

  - name: stg_category_translation
    description: "Cleaned product category translation"
    columns:
      - name: product_category_name
        data_tests:
          - not_null
          - unique