
services:
  # =====================================================
  # CLICKHOUSE DATABASE
  # =====================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: olist-clickhouse
    restart: always

    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: adminpass123
      CLICKHOUSE_DB: olist_clickhouse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    ports:
      - "8123:8123"
      - "9000:9000"

    volumes:
      - clickhouse_data:/var/lib/clickhouse

  # =====================================================
  # AIRFLOW COMMON CONFIGURATION
  # =====================================================
  x-airflow-common: &airflow-common
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: apache/airflow:3.4.0

    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor

      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@postgres/airflow

      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow

      AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}

      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_dev_jwt_secret}

      AIRFLOW__API_AUTH__JWT_ISSUER: airflow

      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

      AIRFLOW_CONFIG: /opt/airflow/config/airflow.cfg

      _PIP_ADDITIONAL_REQUIREMENTS: ""

    volumes:
      # Airflow folders
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/config:/opt/airflow/config
      - ../airflow/plugins:/opt/airflow/plugins

      # Olist project folders
      - ../dbt/olist_dbt:/opt/airflow/dbt/olist_dbt
      - ../data:/opt/airflow/data
      - ../scr:/opt/airflow/scripts

    user: "${AIRFLOW_UID:-50000}:0"

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # =====================================================
  # AIRFLOW POSTGRESQL
  # =====================================================
  postgres:
    image: postgres:16
    container_name: airflow-postgres
    restart: always

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  # =====================================================
  # REDIS
  # =====================================================
  redis:
    image: redis:7.2-bookworm
    container_name: airflow-redis
    restart: always

    expose:
      - "6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

  # =====================================================
  # AIRFLOW API SERVER
  # =====================================================
  airflow-apiserver:
    <<: *airflow-common

    command: api-server

    ports:
      - "8080:8080"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/api/v2/monitor/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # =====================================================
  # AIRFLOW SCHEDULER
  # =====================================================
  airflow-scheduler:
    <<: *airflow-common

    command: scheduler

    healthcheck:
      test:
        - CMD-SHELL
        - 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # =====================================================
  # AIRFLOW DAG PROCESSOR
  # =====================================================
  airflow-dag-processor:
    <<: *airflow-common

    command: dag-processor

    healthcheck:
      test:
        - CMD-SHELL
        - 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # =====================================================
  # AIRFLOW WORKER
  # =====================================================
  airflow-worker:
    <<: *airflow-common

    command: celery worker

    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"

    healthcheck:
      test:
        - CMD-SHELL
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # =====================================================
  # AIRFLOW TRIGGERER
  # =====================================================
  airflow-triggerer:
    <<: *airflow-common

    command: triggerer

    healthcheck:
      test:
        - CMD-SHELL
        - 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # =====================================================
  # AIRFLOW INITIALIZATION
  # =====================================================
  airflow-init:
    <<: *airflow-common

    entrypoint: /bin/bash

    command:
      - -c
      - |
        set -e

        airflow db migrate

        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          || echo "Airflow admin user already exists."

    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}

    user: "50000:0"

    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

# =====================================================
# PERSISTENT VOLUMES
# =====================================================
volumes:
  clickhouse_data:
  airflow_postgres_data:
